name: ecommerce-mycompany

services:
  mysql:
    image: mysql:8.4
    container_name: ecommerce-mycompany-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    env_file:
      - ./dashboard/.env
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ecommerce-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: ecommerce-mycompany-dashboard
    restart: unless-stopped
    ports:
      - "8009:80"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    env_file:
      - ./dashboard/.env
    volumes:
      - ./dashboard:/var/www/html
    networks:
      - ecommerce-network
    depends_on:
      mysql:
        condition: service_healthy

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
      target: development
    container_name: ecommerce-mycompany-website
    restart: unless-stopped
    ports:
      - "8010:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      WDS_SOCKET_PORT: 8010
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_API_URL: http://localhost:8009/api/v1
    volumes:
      - ./website:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - dashboard
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  mysql-data:

