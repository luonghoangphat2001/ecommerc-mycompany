name: ecommerce-mycompany

services:
  mysql:
    image: mysql:8.4
    container_name: ecommerce-mycompany-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ecommercmycompany
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ecommerce
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ecommerce-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: ecommerce-mycompany-dashboard
    restart: unless-stopped
    ports:
      - "8009:80"
    environment:
      APP_URL: http://localhost:8009
      FRONTEND_URL: http://localhost:8010
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8010,http://localhost:5173,http://127.0.0.1:8010,http://127.0.0.1:3000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ecommercmycompany
      DB_USERNAME: ecommerce
      DB_PASSWORD: ecommerce
    volumes:
      - ./dashboard:/var/www/html
    networks:
      - ecommerce-network
    depends_on:
      mysql:
        condition: service_healthy

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
      target: development
    container_name: ecommerce-mycompany-website
    restart: unless-stopped
    ports:
      - "8010:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      WDS_SOCKET_PORT: 8010
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_API_URL: http://localhost:8009/api/v1
    volumes:
      - ./website:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - dashboard
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  mysql-data:

